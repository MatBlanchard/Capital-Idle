name: Construire APK Android
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests automatiques du moteur économique
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Vérifier la configuration de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPITAL_IDLE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CAPITAL_IDLE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Configurer les secrets CAPITAL_IDLE_KEYSTORE_BASE64 et CAPITAL_IDLE_STORE_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Restaurer la clé de signature privée
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPITAL_IDLE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/capitalidle-release.p12"
          chmod 600 "$RUNNER_TEMP/capitalidle-release.p12"
      - name: Compiler APK signé
        env:
          CAPITAL_IDLE_KEYSTORE: ${{ runner.temp }}/capitalidle-release.p12
          CAPITAL_IDLE_STORE_PASSWORD: ${{ secrets.CAPITAL_IDLE_STORE_PASSWORD }}
          CAPITAL_IDLE_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CapitalIdle-APK-signe
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publier la mise à jour GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CapitalIdle.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" CapitalIdle.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Capital Idle build ${GITHUB_RUN_NUMBER}" \
            --notes "Mise à jour Android automatique issue du commit ${GITHUB_SHA}." \
            --latest
