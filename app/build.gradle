plugins { id 'com.android.application' }
android {
    namespace 'com.capitalidle.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.capitalidle.game'
        minSdk 24
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '0.5.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        permanent {
            if (System.getenv('CAPITAL_IDLE_KEYSTORE')) {
                storeFile file(System.getenv('CAPITAL_IDLE_KEYSTORE'))
                storePassword System.getenv('CAPITAL_IDLE_STORE_PASSWORD')
                keyAlias 'capitalidle'
                keyPassword System.getenv('CAPITAL_IDLE_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.permanent
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
